<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Script Extractor</title>
  <desc id="desc">A YouTube link becomes a transcript. Built for people and their AI assistants.</desc>
  <rect width="1280" height="400" rx="24" fill="#111820"/>
  <path d="M850 0v400M1050 0v400M0 300h1280" stroke="#21303c"/>
  <rect x="66" y="58" width="178" height="32" rx="16" fill="#bdfc71"/>
  <text x="88" y="80" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111820">LINK → WORDS</text>
  <text x="64" y="162" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#f4f7fa">YouTube Script</text>
  <text x="64" y="224" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#f4f7fa">Extractor</text>
  <text x="67" y="271" font-family="Arial,sans-serif" font-size="21" fill="#b2c0cc">Paste a link. Keep the words.</text>
  <text x="67" y="354" font-family="Arial,sans-serif" font-size="16" fill="#b2c0cc">PYTHON  /  TXT · SRT · JSON  /  AI HANDOFF GUIDE</text>
